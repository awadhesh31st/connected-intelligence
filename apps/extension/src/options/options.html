<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask This Page — Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Ask This Page — Settings</h1>
      <p class="hint">
        This extension calls Google's Gemini API directly from your browser using your own API
        key. The key is stored only in your browser's local extension storage and is never sent
        anywhere except Google's API.
      </p>

      <form id="settings-form">
        <label for="api-key">Gemini API key</label>
        <input id="api-key" name="api-key" type="password" autocomplete="off" placeholder="AIza..." />
        <p class="hint">
          Don't have one? Create a free key at
          <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">aistudio.google.com/apikey</a>.
        </p>

        <label for="model">Model</label>
        <select id="model" name="model">
          <option value="gemini-2.0-flash">Gemini 2.0 Flash (recommended)</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite (fastest)</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </select>

        <div class="actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="test-btn">Test key</button>
          <button type="button" id="clear-btn" class="secondary">Clear</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
